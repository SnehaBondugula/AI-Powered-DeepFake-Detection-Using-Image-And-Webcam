<!DOCTYPE html>
<html>
<head>
  <title>Detection Result</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Detection Result</h1>
    <p><strong>Prediction:</strong></p>
    <ul>
      {% for pred in result %}
        <li>{{ pred }}</li>
      {% endfor %}
    </ul>
    {% if image_url %}
    <img src="{{ url_for('static', filename='uploads/' + image_url.split('/')[-1]) }}" alt="Uploaded Image" class="resized-image">
    {% else %}
    <p>No image available.</p>
    {% endif %}
    <a href="{{ url_for('main.index') }}">Go Back</a>
  </div>
</body>
</html>
