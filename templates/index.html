<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deepfake Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
  <h1 class="text-center mb-4">Deepfake Detection</h1>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <div class="row">
    <!-- Upload Section -->
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Upload Image</h2>
          <form action="{{ url_for('main.upload') }}" method="post" enctype="multipart/form-data" onsubmit="showLoading()">
            <input type="file" name="file" class="form-control" accept="image/*" required>
            <button type="submit" class="btn btn-primary mt-3 w-100">
              <i class="fas fa-upload"></i> Detect
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Webcam Section -->
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Use Webcam</h2>
          <video id="video" width="100%" height="auto" autoplay class="border rounded"></video>
          <button id="capture" class="btn btn-success mt-3 w-100">
            <i class="fas fa-camera"></i> Capture & Detect
          </button>
          <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
          <div id="webcam-result" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Animation -->
  <div id="loading" class="text-center mt-4" style="display:none;">
    <img src="{{ url_for('static', filename='loading.gif') }}" alt="Loading...">
    <p>Processing...</p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script>
  function showLoading() {
    document.getElementById('loading').style.display = 'block';
  }
</script>

</body>
</html>
